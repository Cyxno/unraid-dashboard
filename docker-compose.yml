services:
  unraid-dashboard:
    build: .
    image: unraid-dashboard:latest
    container_name: unraid-dashboard
    restart: unless-stopped
    ports:
      # Host port is configurable; the container always listens on 3000.
      - "${DASHBOARD_PORT:-3080}:3000"
    environment:
      # Where the Unraid GraphQL API lives.
      UNRAID_URL: ${UNRAID_URL:?set UNRAID_URL in .env or your environment}
      UNRAID_API_KEY: ${UNRAID_API_KEY:?set UNRAID_API_KEY in .env or your environment}
      # Optional: Prometheus server for time-series metrics and history.
      # Without it the dashboard still serves all Unraid state.
      # PROMETHEUS_URL: http://127.0.0.1:9090
      # PROMETHEUS_TIMEOUT_MS: "5000"
      # UNRAID_TIMEOUT_MS: "10000"
      # UNRAID_GRAPHQL_PATH: /graphql
      # On Unraid, replace the published port with host networking if needed:
      # network_mode: host
