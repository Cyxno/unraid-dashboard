name: Build and publish Docker image

# Release pipeline (v1.3.16 hardening):
#   build (loaded locally) → IMAGE BOOT SMOKES → only then push to GHCR.
# A broken image (boot failure, wrong version metadata, missing modules,
# degraded fresh inventory) can no longer reach the registry.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cyxno/unraid-dashboard

permissions:
  contents: read
  packages: write

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute build provenance
        id: ver
        run: |
          # Fase 4 (v1.3.17): the product version is ALWAYS the package
          # semver — release builds take it from the tag (the version
          # contract test pins them equal), main/latest builds take it
          # from package.json and expose the channel separately. A branch
          # name is never a version.
          VERSION=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "channel=release" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "channel=main" >> "$GITHUB_OUTPUT"
          fi
          echo "revision=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build dashboard image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: beacon-dashboard:candidate
          labels: |
            org.opencontainers.image.title=unraid-dashboard
            org.opencontainers.image.description=Self-hosted Unraid server dashboard (Next.js BFF over the Unraid GraphQL API)
            org.opencontainers.image.vendor=Cyxno
            org.opencontainers.image.source=https://github.com/Cyxno/unraid-dashboard
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.cyxno.image.channel=${{ steps.ver.outputs.channel }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_CHANNEL=${{ steps.ver.outputs.channel }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=dash-v${{ steps.ver.outputs.version }}
          cache-to: type=gha,mode=max,scope=dash-v${{ steps.ver.outputs.version }}

      - name: Compute helper internal version
        id: helperver
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Build helper image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: helper/Dockerfile
          push: false
          load: true
          tags: beacon-helper:candidate
          build-args: |
            APP_VERSION=${{ steps.helperver.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_CHANNEL=${{ steps.ver.outputs.channel }}
          labels: |
            org.opencontainers.image.title=unraid-dashboard-helper
            org.opencontainers.image.source=https://github.com/Cyxno/unraid-dashboard
            # helper reports its INTERNAL semver (package.json), independent
            # of the ref name — coherent with HELPER_VERSION and the deploy
            # precheck that compares label vs requested tag on semver tags
            org.opencontainers.image.version=${{ steps.helperver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.cyxno.image.channel=${{ steps.ver.outputs.channel }}
          cache-from: type=gha,scope=helper-v${{ steps.helperver.outputs.version }}
          cache-to: type=gha,scope=helper-v${{ steps.helperver.outputs.version }},mode=max

      - name: Smoke dashboard image (boot, version contract, PWA, SSE)
        run: |
          chmod +x scripts/smoke-dashboard-image.sh
          scripts/smoke-dashboard-image.sh beacon-dashboard:candidate "${{ steps.ver.outputs.version }}"

      - name: Smoke helper image (boot, mock-docker fresh inventory, version contract)
        run: |
          chmod +x scripts/smoke-helper-image.sh
          # The helper reports its INTERNAL version (package.json) — on
          # main pushes the ref-name is "main" while the internal version
          # stays semver, so expect the package version here.
          HELPER_EXPECTED=$(node -p 'require("./package.json").version')
          scripts/smoke-helper-image.sh beacon-helper:candidate "$HELPER_EXPECTED"

      - name: Export candidate images for the publish job
        run: |
          docker save beacon-dashboard:candidate -o /tmp/dashboard-image.tar
          docker save beacon-helper:candidate -o /tmp/helper-image.tar

      - name: Upload candidate images
        uses: actions/upload-artifact@v4
        with:
          name: candidate-images
          path: |
            /tmp/dashboard-image.tar
            /tmp/helper-image.tar
          retention-days: 1

  publish:
    needs: build-and-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (smoke scripts)
        uses: actions/checkout@v4

      - name: Download validated candidate images
        uses: actions/download-artifact@v4
        with:
          name: candidate-images
          path: /tmp

      - name: Load candidate images
        run: |
          docker load -i /tmp/dashboard-image.tar
          docker load -i /tmp/helper-image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push validated dashboard image
        run: |
          V="${{ needs.build-and-smoke.outputs.version }}"
          CH="${{ needs.build-and-smoke.outputs.channel }}"
          R="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          # Immutable-semver policy (v1.3.18): ONLY release builds may publish
          # the semver tag. Main/latest builds push :latest and :sha- only —
          # they must never overwrite a released version tag.
          docker tag beacon-dashboard:candidate "$R:latest"
          docker push "$R:latest"
          docker tag beacon-dashboard:candidate "$R:sha-${{ github.sha }}"
          docker push "$R:sha-${{ github.sha }}"
          if [ "$CH" = "release" ]; then
            docker tag beacon-dashboard:candidate "$R:$V"
            docker push "$R:$V"
          else
            echo "main build: semver tag $V not touched (immutable)"
          fi

      - name: Push validated helper image
        run: |
          V="${{ needs.build-and-smoke.outputs.version }}"
          CH="${{ needs.build-and-smoke.outputs.channel }}"
          R="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-helper"
          docker tag beacon-helper:candidate "$R:latest"
          docker push "$R:latest"
          docker tag beacon-helper:candidate "$R:sha-${{ github.sha }}"
          docker push "$R:sha-${{ github.sha }}"
          if [ "$CH" = "release" ]; then
            docker tag beacon-helper:candidate "$R:$V"
            docker push "$R:$V"
          else
            echo "main build: semver tag $V not touched (immutable)"
          fi

      - name: Re-verify published artifacts match the validated candidates
        run: |
          chmod +x scripts/verify-published.sh
          V="${{ needs.build-and-smoke.outputs.version }}"
          CH="${{ needs.build-and-smoke.outputs.channel }}"
          HELPERV=$(node -p 'require("./package.json").version')
          # Channel-aware target: release builds verify their immutable
          # semver tag; main builds verify :latest (they never publish $V).
          if [ "$CH" = "release" ]; then
            DASH="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$V"
            HELP="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-helper:$V"
          else
            DASH="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            HELP="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-helper:latest"
          fi
          scripts/verify-published.sh dashboard "$DASH" "$V" "$CH"
          scripts/verify-published.sh helper "$HELP" "$HELPERV" "$CH"
